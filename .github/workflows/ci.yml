name: CI

# Runs for every pull request and for every push to main, also when only documents
# changed: the "build" and "windows" checks are required before a merge, and a required
# check that does not run would block the pull request. See docs/work/branches.md.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: src

# A test that hangs instead of failing ends its job after 15 minutes instead of GitHub's
# default of six hours.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json
      - run: dotnet build --configuration Release
      - run: dotnet format --verify-no-changes
      # Every test but those that need Windows. Those that need PostgreSQL start it in Docker.
      - run: dotnet test --configuration Release --no-build --filter-not-trait "Requires=Windows"

  # The same lane on Windows, where the agent, the COM worker and the console run. A
  # required check of main as well: those programs run nowhere else.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json
      - run: dotnet build --configuration Release
      # Every test but those that need PostgreSQL: the Windows runners have no Linux containers.
      - run: dotnet test --configuration Release --no-build --filter-not-trait "Requires=PostgreSQL"
